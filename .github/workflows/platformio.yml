name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Se déclenche uniquement sur les tags de version (ex: v1.0.0)

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get Changelog
        id: changelog
        run: |
          # Récupère les commits depuis le dernier tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Corps de la release écrit dans un fichier : les substitutions $(...)
          # ne sont PAS interprétées dans un input `body:` d'action.
          {
            echo "## 🚀 PreciseTime-ESP v${GITHUB_REF#refs/tags/v}"
            echo ""
            echo "Bibliothèque de chronométrage haute précision pour ESP8266/ESP32."
            echo ""
            echo "### 📦 Installation"
            echo ""
            echo "**PlatformIO:**"
            echo '```ini'
            echo "[env:esp8266]"
            echo "lib_deps = "
            echo "    https://github.com/Fo170/PreciseTime-ESP.git#v${GITHUB_REF#refs/tags/v}"
            echo '```'
            echo ""
            echo "**Arduino IDE:**"
            echo "- Téléchargez le fichier Source code (zip) ci-dessous"
            echo "- Sketch → Include Library → Add .ZIP Library"
            echo ""
            echo "### 📝 Changements dans cette version"
            echo ""
            echo "$CHANGELOG"
            echo ""
            echo "### 📚 Documentation"
            echo ""
            echo "Voir le [README](https://github.com/Fo170/PreciseTime-ESP/blob/main/README.md) et le [CHANGELOG](https://github.com/Fo170/PreciseTime-ESP/blob/main/CHANGELOG.md)."
            echo ""
            echo "### 🐛 Signaler un bug"
            echo ""
            echo "[Ouvrir une issue](https://github.com/Fo170/PreciseTime-ESP/issues/new)"
          } > release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body_path: release_body.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            LICENSE
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify PlatformIO Registry
        if: success()
        run: |
          echo "✅ Release v${{ steps.get_version.outputs.VERSION }} créée avec succès"
          echo "📌 La librairie sera disponible dans PlatformIO Registry après indexation"
          echo "🔗 URL: https://github.com/Fo170/PreciseTime-ESP/releases/tag/v${{ steps.get_version.outputs.VERSION }}"
